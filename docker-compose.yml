services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  main_agent:
    build:
      context: ./main_agent
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - music_agent
      - video_agent
      - reading_agent

  music_agent:
    build:
      context: ./music_agent
    env_file:
      - .env.docker
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      - ollama

  video_agent:
    build:
      context: ./video_agent
    env_file:
      - .env.docker
    ports:
      - "8002:8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    depends_on:
      - ollama

  reading_agent:
    build:
      context: ./reading_agent
    env_file:
      - .env.docker
    ports:
      - "8003:8003"
    command: uvicorn main:app --host 0.0.0.0 --port 8003

volumes:
  ollama_data:
